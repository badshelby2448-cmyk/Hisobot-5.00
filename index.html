.blt tfoot td,.blt tfoot .s{background:var(--soft)}.blt .sumr td{border-top:2px solid var(--ink)}
.blsheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.blsheet>div{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;max-height:82vh;display:flex;flex-direction:column;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.bllist{overflow-y:auto;flex:1;border:1px solid var(--line);border-radius:12px}

.chrow:last-of-type{border-bottom:0}.chrow input{width:100%;text-align:right}.chrow .tt{text-align:right;font-weight:700;white-space:nowrap}

<main>
<header class="hero">
<div class="bar"><h1>Yuk hisoboti</h1><button id="compact"></button><button id="theme"></button></div>
<div class="dates" id="dates"><button id="prev" aria-label="Oldingi kun">‹</button><input type="date" id="date" aria-label="Sana"><button id="next" aria-label="Keyingi kun">›</button></div>
<div class="stats" id="stats"><div><small>Nurli Quyosh</small><b data-s="nq">0</b></div><div><small>Uch Tepa</small><b data-s="ut">0</b></div><div><small>Jami pul</small><b data-s="got">0</b></div></div>
</header>
<nav aria-label="Bo'limlar"><button data-v="day"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h3"/></svg>Kunlik</button><button data-v="month"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Oylik</button><button data-v="price"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V3h9l9 9-9 9zM7.5 7.5h.01"/></svg>Narxlar</button><button data-v="blanka"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6v3H9zM7 5.5H5V21h14V5.5h-2M9 12h6M9 16h4"/></svg>Blanka</button></nav>
<div class="mut" id="status" role="status"></div>
<div id="view" style="display:grid;gap:12px;grid-template-columns:minmax(0,1fr)"></div>
</main>
<script>
const WH={nq:"Nurli Quyosh",ut:"Uch Tepa"};
const LIST=[["SIYOB2",33900],["SIYOB3",33500],["Siyob4",33500],["Siyob5",33500],["Siyob6",30900],["ArbaT Tabaka (05-08)",30400],["Arba1 (08-09)",30400],["Arba2 (09-1.05)",28900],["Arba3 (1,05-1,15)",28900],["Arba4 (1.15-1.25)",28900],["Arba5 (1.25-1.4)",28900],["Arba6 (1.4-1.5)",28900],["KATTA ARBA 1.5-1,8",25900],["Asfa 12-13",27900],["YIRIK",24500],["Qopli 10-11",28500],["Qopli 1,1-1,3",27900],["Qopli 1,3-1,4",29500],["ARBA (okoroc)",27900],["Favorit ok.",16900],["Yangi okorocka (св.)",25900],["Turk golen",30900],["Golen YANGI",26900],["Qopcha golen (karobka)",30900],["ARBA golen (paket)",35900],["Qanot YANGI sv.",36900],["Qanot karobka (qop)",38500],["ARBA qanot (paket)",42500],["Yelkacha-B (Polsha)",29500],["Rus. Yelkacha",33500],["UKR. Yelkacha (A-klas)",36500],["File sv.",34500],["file (muzlagan)",35900],["Mayda file",22500],["ARBA file (+paket)",39900],["Yangi bedro (sv.)",31400],["Bedro ARBA paket",35900],["Bedro (siyob)",35400],["Bedro (marinovka)",35400],["Teri",11000],["Karkas",6000],["Oshqozon.",6900],["Jigar.",5500],["Pangasius (rasepnoy)",49500],["Pangasius (butun baliq)",49500],["BUTUN O'rdak",31300],["O‘rdak file",31500],["Terisiz O‘RDAK file",33500],["oyoqcha o'rdak",27900],["Sosiska (Canada🇨🇦)",26900],["Sosiska (Rossiya🇷🇺)",13500],["86- TIL",49900],["152-kalla go'sht",71900],["64-Sarpanja",93500]];
const DEF={ver:2,pct:0.2,nq:LIST,ut:LIST};
const $=s=>document.querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dec=s=>parseFloat(String(s??"").replace(/\s/g,"").replace(",","."))||0;
const kgv=s=>Math.round(String(s??"").split("+").reduce((a,p)=>a+dec(p),0)*1000)/1000;
// pul: "100 000+800'000" kabi yozuvni qo'shib beradi
const money=s=>String(s??"").split("+").reduce((a,p)=>a+(parseInt(p.replace(/\D/g,""),10)||0),0);
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");
const r1000=n=>Math.round(n/1000)*1000;
const kgf=n=>String(Math.round(n*100)/100).replace(".",",");
const whRaw=(d,k)=>d[k].reduce((a,r)=>a+kgv(r.kg)*money(r.price),0);
const payVal=(d,p)=>p.type==="Valyuta"?dec(p.amount)*money(p.rate):p.type==="Plastik"?money(p.amount)*(1-d.pct/100):money(p.amount);
const TYPES=["Naqd","Click","Plastik","Valyuta"];
function totals(d){const t={nq:r1000(whRaw(d,"nq")),ut:r1000(whRaw(d,"ut")),by:{},usd:0};
 TYPES.forEach(k=>t.by[k]=0);
 d.pays.forEach(p=>{t.by[p.type]+=payVal(d,p);if(p.type==="Valyuta")t.usd+=dec(p.amount)});
 t.by.Plastik=Math.round(t.by.Plastik);
 t.plRaw=d.pays.reduce((a,p)=>a+(p.type==="Plastik"?money(p.amount):0),0);t.plCut=t.plRaw-t.by.Plastik;
 t.load=t.nq+t.ut;t.got=TYPES.reduce((a,k)=>a+t.by[k],0);t.exp=d.exps.reduce((a,e)=>a+money(e.amount),0);t.cash=t.by.Naqd-t.exp;return t}
const plLine=(d,t)=>`${fmt(t.plRaw)} - ${kgf(d.pct)}% = ${fmt(t.by.Plastik)}`;
const signed=n=>(n<0?"-":"")+fmt(Math.abs(n));
function report(date,d){const t=totals(d),o=["📅 "+date.split("-").reverse().join(".")];
 for(const k in WH){const rows=sorted(d[k]);if(!rows.length)continue;
  o.push("",WH[k]);rows.forEach(r=>o.push(`${r.name}: ${kgf(kgv(r.kg))} kg × ${fmt(money(r.price))}`));o.push("Jami: "+fmt(t[k]))}
 o.push("","TOP PUL");
 TYPES.forEach(k=>{const l=d.pays.filter(p=>p.type===k&&payVal(d,p));if(!l.length)return;
  o.push(k==="Click"?"Click:":`${k}: ${k==="Plastik"?plLine(d,t):fmt(t.by[k])}`);
  if(k==="Click"){o.push("  "+clickParts(l).join(" + "));return}
  l.forEach(p=>{if(k==="Valyuta")o.push(`  ${p.who||"-"}: ${kgf(dec(p.amount))}$ × ${fmt(money(p.rate))}`);
   else if(p.who||l.length>1||String(p.amount).includes("+"))o.push(`  ${p.who?p.who+": ":""}${String(p.amount).split("+").map(x=>fmt(money(x))).join(" + ")}`)})});
 o.push("Jami pul: "+fmt(t.got));
 const ex=d.exps.filter(e=>money(e.amount));
 if(ex.length){o.push("","Rasxod: "+fmt(t.exp));ex.forEach(e=>o.push(`  ${e.name||"-"}: ${fmt(money(e.amount))}`))}
 return o.join("\n")}

// hisobotni daftar ko'rinishida rasmga chizadi
function band(g,W,H){const x=g.createLinearGradient(0,0,W,0);x.addColorStop(0,"#b81d13");x.addColorStop(.5,"#f57c00");x.addColorStop(1,"#ffcc19");g.fillStyle=x;g.fillRect(0,0,W,16);g.fillRect(0,H-16,W,16)}
const ORDER=["SIYOB2","SIYOB3","Siyob4","Siyob5","Siyob6","Bedro ARBA paket","Bedro (siyob)","ARBA (okoroc)","Favorit ok.","Yangi okorocka (св.)","Qopli 10-11","Qopli 1,1-1,3","Qopli 1,3-1,4","Qanot YANGI sv.","Qanot karobka (qop)","ARBA qanot (paket)","File sv.","file (muzlagan)","Mayda file","ARBA file (+paket)","Turk golen","Golen YANGI","Qopcha golen (karobka)","ARBA golen (paket)","Yelkacha-B (Polsha)","Rus. Yelkacha","UKR. Yelkacha (A-klas)","Yangi bedro (sv.)","Bedro (marinovka)","ArbaT Tabaka (05-08)","Arba1 (08-09)","Arba2 (09-1.05)","Arba3 (1,05-1,15)","Arba4 (1.15-1.25)","Arba5 (1.25-1.4)","Arba6 (1.4-1.5)","KATTA ARBA 1.5-1,8","YIRIK","Teri","Karkas","Oshqozon.","Jigar.","Pangasius (rasepnoy)","Pangasius (butun baliq)","BUTUN O'rdak","O‘rdak file","Terisiz O‘RDAK file","oyoqcha o'rdak","Sosiska (Canada🇨🇦)","Sosiska (Rossiya🇷🇺)","Asfa 12-13","86- TIL","152-kalla go'sht","64-Sarpanja"];
// tayyor hisobotdagi tartib; ro'yxatda yo'q nomlar oxirida, qo'shilgan tartibida
const rank=n=>{const i=ORDER.findIndex(x=>norm(x)===norm(n));return i<0?ORDER.length:i};
const sorted=rows=>rows.filter(r=>kgv(r.kg)).sort((a,b)=>rank(a.name)-rank(b.name));
// har bir Click summasi, ism bo'lsa birinchi summasi oldida
const clickParts=l=>l.flatMap(p=>String(p.amount).split("+").filter(a=>money(a)).map((a,i)=>(i===0&&p.who?p.who+": ":"")+fmt(money(a))));
function picture(date,d){const t=totals(d),W=1080,P=48,IN=W-2*P,c=document.createElement("canvas"),g=c.getContext("2d"),ops=[];
 const RED="#b81d13",INK="#2e140d",MUT="#80594a",LINE="#f0dfbd";
 const text=(s,x,y,{s:size=30,b=0,a="left",c:col=INK,w=IN}={})=>ops.push(()=>{g.font=`${b?700:400} ${size}px 'Golos Text',system-ui,sans-serif`;g.textAlign=a;g.fillStyle=col;g.fillText(s,x,y,w)});
 const box=(x,y,w,h,col,r=22)=>ops.push(()=>{g.fillStyle=col;g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.fill()});

const withTimeout=(p,ms,msg)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))]);
async function prConnect(say){if(PR.chr&&PR.dev?.gatt?.connected)return PR.chr;
 if(!PR.dev){say("1/4 Ro'yxatdan printerni tanlang...");PR.dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:PSERV});PR.dev.addEventListener("gattserverdisconnected",()=>{PR.chr=null})}
 say("2/4 "+(PR.dev.name||"Printer")+" ga ulanilmoqda...");
 let srv;for(let k=0;k<2&&!srv;k++){try{srv=await withTimeout(PR.dev.gatt.connect(),12000,"TIMEOUT")}catch(e){try{PR.dev.gatt.disconnect()}catch(x){}if(k)throw e}}
 say("3/4 Yozish kanali qidirilmoqda...");
 const svs=await withTimeout(srv.getPrimaryServices(),8000,"TIMEOUT"),found=[];let pick=null;
 for(const sv of svs){let chs=[];try{chs=await sv.getCharacteristics()}catch(e){}
  for(const ch of chs){const w=ch.properties.write||ch.properties.writeWithoutResponse;found.push(sv.uuid.slice(4,8)+"/"+ch.uuid.slice(4,8)+(w?"*":""));
   if(w){const rank=PSERV.indexOf(sv.uuid);if(!pick||(rank>=0&&(pick.rank<0||rank<pick.rank)))pick={ch,rank}}}}
 PR.found=found.join(" ")||"hech narsa";
 if(!pick)throw new Error("NOCHR");PR.chr=pick.ch;return pick.ch}
async function prSend(ch,data,prog){const resp=!!ch.properties.write,n=resp?Math.min(prefs.chunk||100,100):Math.min(prefs.chunk||100,20);
 for(let i=0;i<data.length;i+=n){const part=data.slice(i,i+n);
  if(resp)await withTimeout(ch.writeValueWithResponse?ch.writeValueWithResponse(part):ch.writeValue(part),8000,"TIMEOUT");else await ch.writeValueWithoutResponse(part);
  await new Promise(r=>setTimeout(r,resp?5:12));if(prog)prog(Math.min(100,Math.round((i+n)/data.length*100)))}}
function escposRaster(c,rows=96){const w=c.width,h=c.height,px=c.getContext("2d").getImageData(0,0,w,h).data,wb=Math.ceil(w/8),out=[0x1b,0x40];
 for(let y0=0;y0<h;y0+=rows){const hh=Math.min(rows,h-y0);out.push(0x1d,0x76,0x30,0,wb&255,wb>>8,hh&255,hh>>8);
  for(let y=y0;y<y0+hh;y++)for(let xb=0;xb<wb;xb++){let b=0;for(let k=0;k<8;k++){const x=xb*8+k;let v=0;if(x<w){const i=(y*w+x)*4;v=(0.299*px[i]+0.587*px[i+1]+0.114*px[i+2])<150?1:0}b=(b<<1)|v}out.push(b)}}
 out.push(0x1b,0x64,6);return new Uint8Array(out)}

 btn.disabled=true;say("Boshlandi...");

   m==="TIMEOUT"?"Printer javob bermadi. Telefonning Bluetooth sozlamasida printerni uzing (Forget), printerni o'chirib-yoqing va qayta urining.":
   m==="NOCHR"?"Printerda yozish kanali topilmadi (topilgan: "+PR.found+"). Pastdagi RawBT tugmasini sinab ko'ring.":
   n==="NetworkError"?"Chop etish uzildi: "+m+". \"Sekin (ishonchli)\" ni tanlab qayta urining.":
